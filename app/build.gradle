plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.svitlo'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.svitlo'
        minSdk 7          // Android 2.1; выше 9 (2.3) ничего не требуется кроме этого значения
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}
// Ни одной внешней зависимости: только android.jar.
